# Cloud-Mac CI for the iOS build — this repo lives on a Windows machine, so
# every iOS binary is built here. See IOS-RELEASE.md for the one-time setup
# (Apple Developer enrollment, App Store Connect API key, Codemagic hookup).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key saved in Codemagic
      # (Teams → Personal Account → Integrations → Developer Portal).
      app_store_connect: terrax-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.terraxtech.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Build number comes from pubspec.yaml (version: x.y.z+N) so iOS and
          # Android carry the same number; Codemagic's own counter is not used.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Lands in TestFlight automatically; App Store submission stays manual.
        submit_to_testflight: true

  android-release:
    name: Android → Play AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      # Upload keystore saved in Codemagic (Teams → Personal Account → Code
      # signing identities → Android keystores, reference name below). The
      # keystore and its passwords are entered there by Dior; the build only
      # ever sees them as CM_KEYSTORE* variables on the build machine.
      android_signing:
        - terrax-upload
      flutter: stable
      java: 21
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Write key.properties from the Codemagic keystore
        script: |
          cat > android/key.properties <<PROPS
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          PROPS
      - name: Build signed AAB + APK
        script: |
          flutter build appbundle --release
          flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt
